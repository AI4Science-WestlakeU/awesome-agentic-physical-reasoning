- name: RLE-Bench
  status: candidate
  year: 2026
  class: Embodied
  physics: realistic
  evaluation: mixed
  capabilities: {GDD: partial, PAP: partial, EE: partial, FE: partial, CLR: yes}
  meets_standard: partial
  paper: https://arxiv.org/abs/2609.34210
  code: https://github.com/RLE-Bench/RLE-Bench
  notes: Coding agents develop artifacts through a shell harness and robot APIs in mostly MuJoCo-based simulators for two to nine hours per task, and a hidden verifier scores each artifact in simulation, with no learned or human judge. Physics judges function in four building tasks, a tower and a cantilever that the agent stacks with a robot arm, a mobile base, and gravity compensation for a leader arm. In the mobile-base design, most models pass the structural checks, yet all nine score zero on the static stability margin.
  footnote: RLE-Bench mixes task forms and takes the class of most of its 51 tasks, which are robot control, policy development, and perception. Four of its tasks are construction scored by physics in simulation. In them the agent builds a tower and a cantilever with a robot arm, designs a mobile base, and designs gravity compensation for a leader arm.
  assessed: 2026-11-05
  assessed_by: maintainer draft (full text read), pending author review

- name: RLE-Bench (Construction Subset)
  status: candidate
  year: 2026
  class: Construction
