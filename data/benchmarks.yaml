# The living audit. One record per benchmark; scripts/build_readme.py renders README.md and data/benchmarks.json from it.
# Out-of-scope examples live in data/out_of_scope.yaml.
#
# Fields
#   status        audited    = assessed and reviewed by the authors of the paper
#                 candidate  = assessed from the published text, pending review by the authors
#   in_paper      true for the eleven benchmarks of Table 2 in the paper (first assessed in January 2026)
#   class         Symbolic-Physical | Embodied | Simplified Sandbox | Construction
#                 (the physics and, where a realistic engine is involved, the task: Construction builds an artifact,
#                 Embodied acts toward a goal; a mixed suite takes the class of most of its tasks;
#                 the class does not decide meets_standard)
#   footnote      optional; printed under the table, for example the other tasks of a mixed suite
#                 (tasks of a mixed suite that belong to another class and are scored on their own may also be recorded
#                 as a separate record named after the suite, such as "RLE-Bench (Construction Subset)")
#   physics       symbolic | simplified | realistic | partial     (what governs the environment; 2D rigid-body engines count as realistic;
#                 partial = physics governs only some tasks, or checks only some properties of the result)
#   evaluation    goal-state | functional | answer | judge | mixed  (how success is decided)
#   capabilities  GDD goal-driven design, PAP physics-aware planning, EE embodied execution,
#                 FE functional evaluation, CLR closed-loop refinement; values yes | no | partial | unclear
#   meets_standard yes | no | partial   (realistic physics AND functional verification)
#   assessed      date of the assessment; assessed_by says who

