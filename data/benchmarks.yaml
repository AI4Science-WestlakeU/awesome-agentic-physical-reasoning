  notes: Coding agents edit a Python control policy for 16 Gymnasium tasks in four families (classic control and Box2D, MuJoCo, MiniGrid grid worlds, robotics and driving) and submit it over a local HTTP service, so the agent never acts in the environment itself. The score is each environment's own cumulative reward for the checkpoint chosen on hidden validation cases, measured on held-out cases with no model or human judge; the reward tracks forward progress in locomotion and racing and reaching a goal in most other tasks. Each run gets 128 training episodes with rollout summaries, trajectories, and errors as feedback; four model-harness pairs, including GPT-5.5 with Codex and Claude Opus 4.7 with Claude Code.
