# Out-of-scope examples. scripts/build_readme.py renders them into the Scope section of README.md.
# The list shows where the scope ends with examples. It is not exhaustive: work missing from it is not thereby in scope.
#
# Fields
#   name      benchmark, dataset, or system
#   year      year of first public release (arXiv v1 when there is one)
#   kind      no-physics-environment  no environment governed by physical dynamics for an agent to act in (criteria 1 and 2)
#             no-text-interface       physical dynamics, but no interface for LLM agents: actions are control signals or action vectors for learning agents (criterion 3)
#             not-a-benchmark         a method or a generator rather than an evaluation suite
#   evaluates what the work evaluates or does, in a short phrase
#   paper     link to the paper
#   source    where the example comes from: paper Section 3.2, paper Appendix B, or the date it was added here

